version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safeguard-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - ML_MODE=yolo
      - MODEL_PATH=models/best.pt
      - CONFIDENCE_THRESHOLD=0.50
      - YOLO_CLASS_NAMES=helmet,no_helmet
      - MAX_UPLOAD_SIZE_MB=100
      - SECRET_KEY=safeguard-ai-prod-secret-key-change-in-production
    volumes:
      - backend-uploads:/app/uploads
      - backend-instance:/app/instance
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/api/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safeguard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-uploads:
  backend-instance:
